<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Couchcade</title>
  <style>
    :root { color-scheme: dark; --bg: #0d0f14; --panel: rgba(20, 24, 33, .94); --line: #2a3142; --muted: #8a93a8; --ink: #f2f4f8; --accent: #ffc93c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, sans-serif; overflow: hidden; cursor: none; }
    #stage { position: fixed; inset: 0; display: grid; place-items: center; }
    canvas { display: block; }
    .overlay { position: fixed; inset: 0; display: none; }
    .overlay.show { display: flex; }

    /* Lobby: everything inside a ~5% safe margin for TV overscan */
    #lobby { padding: 6vh 5vw; gap: 4vw; background: radial-gradient(ellipse at top left, #1b2030 0%, var(--bg) 60%); }
    #lobby .left { flex: 1.4; display: flex; flex-direction: column; min-width: 0; }
    #lobby .right { flex: 1; display: flex; flex-direction: column; align-items: center; max-width: 420px; }
    .logo { font-size: 4.2rem; font-weight: 900; letter-spacing: -.02em; margin: 0; }
    .logo span { color: var(--accent); }
    .tagline { color: var(--muted); margin: 4px 0 4vh; font-size: 1.3rem; }
    h2 { font-size: 1rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 12px; }
    #games { list-style: none; padding: 0; margin: 0 0 4vh; display: grid; gap: 10px; }
    #games li { padding: 16px 20px; border: 2px solid var(--line); border-radius: 14px; background: var(--panel); }
    #games li.sel { border-color: var(--accent); }
    #games .t { font-size: 1.5rem; font-weight: 700; }
    #games .d { color: var(--muted); margin-top: 4px; }
    #players { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; }
    #players li { display: flex; align-items: center; gap: 12px; font-size: 1.35rem; font-weight: 600; min-width: 0; }
    #players li span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #players li.off { opacity: .4; }
    .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; }
    .host { font-size: .8rem; font-weight: 700; color: var(--bg); background: var(--accent); border-radius: 6px; padding: 2px 6px; }
    #hint { margin-top: auto; color: var(--muted); font-size: 1.15rem; }
    .qrbox { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 22px; text-align: center; width: 100%; }
    .qrbox p { margin: 0 0 14px; color: var(--muted); font-size: 1.1rem; }
    #qr { background: #fff; border-radius: 12px; padding: 10px; }
    #qr svg, #qrSmall svg { width: 100%; height: auto; display: block; }
    .url { margin-top: 12px; font-size: 1.25rem; font-weight: 700; word-break: break-all; }

    /* Results */
    #results { align-items: center; justify-content: center; background: rgba(13, 15, 20, .82); }
    #results .card { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 40px 56px; min-width: 520px; text-align: center; }
    #results h1 { font-size: 3rem; margin: 0 0 24px; }
    #standings { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; text-align: left; font-size: 1.5rem; }
    #standings li { display: flex; align-items: center; gap: 14px; }
    #standings .score { margin-left: auto; font-weight: 800; }
    #results .back { margin-top: 24px; color: var(--muted); }

    /* Small join card while a game runs (toggle with J) */
    #joinSmall { position: fixed; right: 4vw; bottom: 5vh; width: 140px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; font-size: .8rem; color: var(--muted); display: none; }
    #joinSmall.show { display: block; }
    #qrSmall { background: #fff; border-radius: 8px; padding: 4px; margin-bottom: 6px; }

    #status { position: fixed; left: 5vw; bottom: 3vh; color: #4b5470; font-size: .85rem; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="canvas"></canvas></div>

  <section id="lobby" class="overlay show">
    <div class="left">
      <h1 class="logo">Couch<span>cade</span></h1>
      <p class="tagline">Party games on the big screen. Your phone is the controller.</p>
      <h2>Games</h2>
      <ul id="games"></ul>
      <h2>Players</h2>
      <ul id="players"></ul>
      <div id="hint">Scan the code to join.</div>
    </div>
    <div class="right">
      <div class="qrbox">
        <p>Scan with your phone camera</p>
        <div id="qr"></div>
        <div class="url" id="url">…</div>
      </div>
    </div>
  </section>

  <section id="results" class="overlay">
    <div class="card">
      <h1 id="resultsTitle"></h1>
      <ol id="standings"></ol>
      <div class="back">Back to the lobby in a few seconds…</div>
    </div>
  </section>

  <aside id="joinSmall"><div id="qrSmall"></div>Scan to join</aside>
  <div id="status">Connecting…</div>

  <script type="module" src="/tv/tv.js"></script>
</body>
</html>
