<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- No zooming: pinch and double-tap would fight the joystick -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Couchcade" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d0f14" />
  <title>Couchcade</title>
  <style>
    :root { color-scheme: dark; --accent: #ffc93c; --line: #2a3142; --panel: #141824; --muted: #8a93a8; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #0d0f14; color: #f2f4f8; font-family: system-ui, -apple-system, sans-serif;
      overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; overflow: hidden; }
    body.playing { touch-action: none; }
    .screen { position: fixed; inset: 0; display: none; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    .screen.active { display: flex; }
    h1 { margin: 0; font-size: 2rem; font-weight: 900; }
    h1 span { color: #ffc93c; }
    button { font: inherit; }
    .primary { font-size: 1.25rem; font-weight: 800; padding: 14px 28px; border-radius: 14px; border: 0; background: var(--accent); color: #0d0f14; }
    .muted { color: var(--muted); }

    /* Join */
    #join { flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
    #name { font-size: 1.3rem; padding: 14px 16px; width: min(320px, 90vw); border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: inherit; text-align: center; user-select: text; -webkit-user-select: text; }
    #joinMsg { color: #ff8c8c; min-height: 1.2em; }

    /* Lobby */
    #lobby { flex-direction: column; gap: 14px; overflow-y: auto; }
    #lobby .me { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: 700; }
    .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); flex: none; }
    /* Game picker: Board & Card / Arcade tabs, a two-column grid of
       tiles that grows with any number of games, and a footer with the pick and Start that stays
       on screen while the list scrolls. */
    #tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: none; margin: 0 -2px; padding: 2px; }
    #tabs::-webkit-scrollbar { display: none; }
    #tabs button { flex: 1 1 0; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-weight: 700; font-size: .95rem; }
    #tabs button.on { background: #f2f4f8; border-color: #f2f4f8; color: #0d0f14; }
    #gameList { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    #gameList button { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); color: inherit; min-width: 0; min-height: 64px; }
    #gameList button.sel { border-color: var(--accent); background: #1d2333; }
    #gameList .icon { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 1.3rem; font-weight: 900; background: #232a3b; }
    #gameList .t { font-weight: 800; font-size: 1rem; line-height: 1.15; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    #gameList .m { color: var(--muted); font-size: .8rem; margin-top: 2px; }
    #gameList .m.short { color: #ff8c8c; }
    #gameList button > div { min-width: 0; }
    #pickFoot { position: sticky; bottom: calc(-1 * max(16px, env(safe-area-inset-bottom))); margin: auto -16px calc(-1 * max(16px, env(safe-area-inset-bottom))); padding: 12px 16px max(16px, env(safe-area-inset-bottom));
      background: linear-gradient(to bottom, rgba(13,15,20,0), #0d0f14 14px); display: grid; gap: 10px; }
    #pickFoot.guest { position: static; margin: 0; padding: 0; background: none; } /* only the pick, right under the status line */
    #gameDetail { padding: 10px 14px; border-radius: 12px; background: var(--panel); border-left: 4px solid var(--accent); }
    #gameDetail .t { font-weight: 800; font-size: 1.1rem; }
    #gameDetail .d { color: var(--muted); font-size: .9rem; margin-top: 2px; line-height: 1.3; }
    .botBtn { flex: 1; font-size: 1rem; font-weight: 700; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: inherit; }
    .botBtn:disabled { opacity: .35; }
    #lobbyMsg { min-height: 1.2em; color: #ff8c8c; }

    /* Pad: left = joystick zone, right = buttons */
    #pad { flex-direction: row; padding: 0; }
    #stickZone { position: relative; flex: 1.3; border-right: 1px solid #1e2433; touch-action: none; }
    #stickHint { position: absolute; inset: 0; display: grid; place-items: center; color: #3a4258; font-size: 1.1rem; pointer-events: none; }
    #stickBase, #stickKnob { position: absolute; border-radius: 50%; pointer-events: none; display: none; transform: translate(-50%, -50%); }
    #stickBase { width: 150px; height: 150px; border: 3px solid var(--line); background: rgba(255,255,255,.03); }
    #stickKnob { width: 70px; height: 70px; background: var(--accent); opacity: .9; }
    #buttons { flex: 1; display: flex; align-items: center; justify-content: center; gap: 24px; touch-action: none; }
    .btn { width: 130px; height: 130px; border-radius: 50%; border: 0; font-size: 1.4rem; font-weight: 800; color: #0d0f14; background: var(--accent); opacity: .9; transition: transform .05s; }
    .btn.secondary { width: 96px; height: 96px; font-size: 1.1rem; background: var(--line); color: #f2f4f8; }
    .btn.down { opacity: 1; transform: scale(.93); }
    .btn.dim { opacity: .35; }
    #hud { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 0; right: 0; display: none; justify-content: center; gap: 10px; align-items: center; font-weight: 700; pointer-events: none; }
    body.playing #hud { display: flex; }
    #hudStatus { color: var(--muted); font-weight: 500; }
    #endBtn { position: fixed; right: max(12px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top)); display: none; font-size: .85rem; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
    body.playing.host #endBtn, body.screens.host #endBtn { display: block; }

    /* Results */
    #results { flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
    #resTitle { font-size: 1.6rem; font-weight: 800; }
    #resList { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 240px; }
    #resList li { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; }
    #resList li b { margin-left: auto; }

    /* Game screens (turn-based games): portrait, scrollable, built from the game's playerView().screen */
    #screen { flex-direction: column; gap: 12px; overflow-y: auto; padding-top: max(58px, calc(env(safe-area-inset-top) + 48px)); }
    #screen h2 { margin: 0; font-size: 1.6rem; font-weight: 900; }
    #screen .tag { align-self: flex-start; padding: 4px 12px; border-radius: 999px; font-weight: 800; color: #0d0f14; background: var(--accent); }
    #screen p { margin: 0; font-size: 1.1rem; line-height: 1.35; }
    #screen .cards { display: grid; gap: 8px; }
    #screen .card { padding: 10px 14px; border-radius: 12px; background: var(--panel); border-left: 6px solid var(--line); }
    #screen .opts { display: grid; gap: 8px; }
    #screen .opt { text-align: left; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); color: inherit; display: flex; align-items: center; gap: 10px; }
    #screen .opt.sel { border-color: var(--accent); background: #1d2333; }
    #screen .opt:disabled { opacity: .4; }
    #screen .opt.locked:not(.sel) { opacity: .5; }
    #screen .t { font-weight: 800; font-size: 1.1rem; }
    #screen .d { color: var(--muted); font-size: .92rem; margin-top: 2px; }
    #screen .hand { display: flex; flex-wrap: wrap; gap: 8px; }
    #screen .pcard { width: 64px; height: 92px; border-radius: 10px; border: 4px solid var(--card, #f2f4f8); color: var(--card, #f2f4f8); background: #141824; font-weight: 900; font-size: 1.6rem;
      display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; padding: 0; }
    #screen .pcard small { font-size: .62rem; font-weight: 800; margin-top: 4px; text-transform: uppercase; letter-spacing: .02em; }
    #screen .pcard:disabled, #screen .pcard.dim { opacity: .3; }
    #screen .pcard.sel { opacity: 1; transform: translateY(-8px); box-shadow: 0 0 0 3px #f2f4f8; }
    #screen .pcard.wild { background: linear-gradient(90deg, #e8484d 0 25%, #2f8fe6 0 50%, #2fb866 0 75%, #e6a817 0) bottom 10px center / 70% 8px no-repeat, #141824; }
    #screen .row { display: flex; gap: 8px; }
    #screen .row input { flex: 1; min-width: 0; font-size: 1.1rem; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: inherit; user-select: text; -webkit-user-select: text; }
    #screen .acts { display: grid; gap: 8px; }
    #screen .secondaryBtn { font-size: 1.1rem; font-weight: 700; padding: 12px 20px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: inherit; }
    #screen button:disabled { opacity: .4; }
    #screen .swatch { height: 72px; border-radius: 14px; display: flex; align-items: flex-end; padding: 8px 12px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); }
    #screen .swatch span { font-weight: 800; font-size: .85rem; padding: 2px 8px; border-radius: 999px; background: rgba(13,15,20,.7); }
    #screen .grid { display: grid; gap: 4px; }
    #screen .gcell { position: relative; min-height: 54px; padding: 4px 2px 10px; border-radius: 8px; border: 0; font-weight: 800; font-size: .78rem; letter-spacing: -.02em; color: #2b2418; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); outline: 0 solid transparent; outline-offset: -3px; }
    #screen .gcell .w { white-space: nowrap; max-width: 100%; overflow: hidden; line-height: 1.05; }
    #screen .gcell .m { font-size: .55rem; font-weight: 800; text-transform: uppercase; opacity: .8; margin-top: 2px; }
    #screen .gcell.dim, #screen .gcell.dim:disabled { opacity: .45; }
    #screen .gcell:disabled { opacity: 1; }
    #screen .gcell.ring { outline-width: 3px; }
    #screen .gcell .dots { position: absolute; left: 3px; right: 3px; bottom: 3px; display: flex; gap: 2px; justify-content: center; }
    #screen .gcell .dots i { width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
    #screen .grid:not(.locked) .gcell:not(:disabled):active { transform: scale(.95); }
    #screen .wheel { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    #screen .wheel canvas { touch-action: none; }
    #screen .nudges { display: grid; grid-template-columns: 1fr 1.6fr 1.6fr 1fr; gap: 6px; width: 100%; max-width: 380px; }
    #screen .nudges button { padding: 10px 6px; font-size: 1rem; }
    #screen .tally { display: grid; gap: 6px; }
    #screen .tally .tt { font-weight: 800; color: var(--muted); font-size: .9rem; }
    #screen .trow { display: grid; grid-template-columns: repeat(auto-fit, minmax(54px, 1fr)); gap: 6px; }
    #screen .tcell { display: flex; flex-direction: column; border-radius: 12px; background: var(--panel); border: 2px solid var(--c, var(--line)); overflow: hidden; }
    #screen .tcell.zero .tface { opacity: .45; }
    #screen .tface { display: flex; flex-direction: column; align-items: center; padding: 6px 2px; line-height: 1.05; }
    #screen .tface .ti { font-size: 1.5rem; }
    #screen .tface b { font-size: 1.3rem; }
    #screen .tface small { font-size: .62rem; color: var(--muted); font-weight: 700; }
    #screen .tcard { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    #screen .tcard.zero canvas { opacity: .35; }
    #screen .tcard small { font-size: .66rem; color: var(--muted); font-weight: 700; }
    #screen canvas.art { display: block; flex: none; }
    #screen .hero { position: relative; align-self: center; perspective: 900px; }
    #screen .hero canvas { position: absolute; inset: 0; backface-visibility: hidden; }
    #screen .hero.flipping .face { transform: rotateY(180deg); animation: heroFace 1.1s .5s cubic-bezier(.3,.7,.3,1) forwards; }
    #screen .hero.flipping .back { animation: heroBack 1.1s .5s cubic-bezier(.3,.7,.3,1) forwards; }
    @keyframes heroFace { to { transform: rotateY(0deg); } }
    @keyframes heroBack { to { transform: rotateY(-180deg); } }
    #screen .gcell.drawn { background: transparent !important; box-shadow: none; }
    #screen .gcell .cellArt { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #screen .gcell.drawn .w, #screen .gcell.drawn .m, #screen .gcell.drawn .dots { position: relative; }
    #screen .gcell.drawn .dots { position: absolute; }
    #screen canvas.strip { margin: 4px 0 2px; }
    #screen .card.withArt { display: flex; align-items: center; gap: 12px; }
    #screen .tbtn { border: 0; background: #232a3b; color: inherit; font-size: 1.3rem; font-weight: 900; padding: 6px 0; }
    #screen .hexmap { display: flex; justify-content: center; }
    #screen .hexmap canvas { touch-action: manipulation; border-radius: 14px; }
    #screen .dial { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    #screen .dial canvas { touch-action: none; }
    #screen .dialLabels { display: flex; justify-content: space-between; gap: 12px; width: 100%; max-width: 420px; font-weight: 700; font-size: .95rem; }
    #screen .dialLabels .l { color: #7cc7e8; }
    #screen .dialLabels .r { color: #f0a070; text-align: right; }
    #screenFooter { min-height: 1.2em; }
    body.screens #hud { display: flex; }

    /* How to play: the step the TV is showing (host can step or skip), and a sheet with every step
       that anyone can open mid-game. */
    #intro { flex-direction: column; gap: 14px; overflow-y: auto; }
    #intro .kicker { color: var(--muted); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: .85rem; }
    #intro h2 { margin: 0; font-size: 1.7rem; font-weight: 900; }
    #intro p { margin: 0; font-size: 1.2rem; line-height: 1.4; }
    .stepDots { display: flex; gap: 6px; }
    .stepDots i { width: 8px; height: 8px; border-radius: 999px; background: var(--line); }
    .stepDots i.on { width: 22px; background: #ffc93c; }
    .stepDots i.done { background: #6b7390; }
    #introHost { display: grid; gap: 10px; margin-top: auto; }
    #introHost .row { display: flex; gap: 10px; }
    #introHost .row button { flex: 1; }
    .ghost { font-size: 1.05rem; font-weight: 700; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: inherit; }
    .ghost:disabled { opacity: .35; }
    #rulesBtn { position: fixed; left: max(12px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top)); display: none; z-index: 5; font-size: .85rem; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: #0d0f14; color: var(--muted); }
    body.hasRules.playing #rulesBtn, body.hasRules.screens #rulesBtn { display: block; }
    #rulesSheet { position: fixed; inset: 0; z-index: 15; display: none; flex-direction: column; gap: 12px; overflow-y: auto; background: #0d0f14;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
    #rulesSheet.show { display: flex; }
    #rulesSheet h2 { margin: 0; font-size: 1.5rem; font-weight: 900; }
    #rulesSheet ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
    #rulesSheet li { padding: 10px 14px; border-radius: 12px; background: var(--panel); border-left: 4px solid #ffc93c; }
    #rulesSheet li b { display: block; font-size: 1.05rem; }
    #rulesSheet li span { color: #c9cfdc; font-size: .98rem; line-height: 1.35; }
    #rulesSheet .acts { display: grid; gap: 8px; margin-top: 4px; }
    body:not(.host) #rulesTvBtn { display: none; }

    /* Header buttons: a 44 px tap area (a fingertip), however small the label looks. */
    #endBtn, #rulesBtn { min-height: 44px; min-width: 44px; padding: 8px 12px; }
    #endBtn.armed { background: #ff5a5f; border-color: #ff5a5f; color: #0d0f14; font-weight: 800; }
    /* Connection lost: grey the screen out under the banner so taps aren't wasted. */
    body.offline .screen.active, body.offline #endBtn, body.offline #rulesBtn { opacity: .35; pointer-events: none; }
    body.offline #conn { bottom: auto; top: 40%; font-size: 1.3rem; font-weight: 800; color: #f2f4f8; }
    #conn { position: fixed; bottom: max(6px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: .8rem; color: var(--muted); pointer-events: none; }

    /* Ask for landscape while playing */
    #rotate { position: fixed; inset: 0; display: none; place-items: center; background: #0d0f14; font-size: 1.3rem; text-align: center; padding: 24px; z-index: 10; }
    @media (orientation: portrait) { body.playing:not(.screens) #rotate { display: grid; } }
  </style>
</head>
<body>
  <section id="join" class="screen active">
    <h1>Couch<span>cade</span></h1>
    <input id="name" maxlength="16" placeholder="Your name" autocomplete="nickname" />
    <button id="joinBtn" class="primary">Join</button>
    <div id="joinMsg"></div>
  </section>

  <section id="lobby" class="screen">
    <div class="me"><span class="dot"></span><span id="meName"></span></div>
    <div id="lobbyInfo" class="muted"></div>
    <div id="tabs"></div>
    <div id="gameList"></div>
    <div id="botRow" style="display:flex;gap:8px">
      <button id="addBotBtn" class="botBtn">+ Add bot</button>
      <button id="removeBotBtn" class="botBtn">− Remove bot</button>
    </div>
    <div id="pickFoot">
      <div id="gameDetail"><div class="t"></div><div class="d"></div></div>
      <button id="startBtn" class="primary">Start</button>
      <div id="lobbyMsg"></div>
    </div>
  </section>

  <section id="pad" class="screen">
    <div id="stickZone">
      <div id="stickHint">Drag here to move</div>
      <div id="stickBase"></div>
      <div id="stickKnob"></div>
    </div>
    <div id="buttons"></div>
  </section>

  <section id="screen" class="screen">
    <div id="screenBody"></div>
    <div id="screenFooter" class="muted"></div>
  </section>

  <section id="intro" class="screen">
    <div class="kicker" id="introKicker"></div>
    <div class="stepDots" id="introDots"></div>
    <h2 id="introTitle"></h2>
    <p id="introText"></p>
    <div id="introGuest" class="muted"></div>
    <div id="introHost">
      <div class="row">
        <button id="introBack" class="ghost">‹ Back</button>
        <button id="introNext" class="ghost">Next ›</button>
      </div>
      <button id="introSkip" class="primary">Skip rules, start playing</button>
    </div>
  </section>

  <section id="results" class="screen">
    <div id="resTitle"></div>
    <ol id="resList"></ol>
    <div class="muted">Back to the lobby in a few seconds…</div>
  </section>

  <div id="hud"><span class="dot"></span><span id="who"></span><span id="hudStatus"></span></div>
  <button id="endBtn">End game</button>
  <button id="rulesBtn">? Rules</button>
  <section id="rulesSheet">
    <h2 id="rulesSheetTitle">How to play</h2>
    <ol id="rulesList"></ol>
    <div class="acts">
      <button id="rulesTvBtn" class="ghost">Replay on the TV</button>
      <button id="rulesClose" class="primary">Back to the game</button>
    </div>
  </section>
  <div id="conn"></div>
  <div id="rotate">↻<br />Turn your phone sideways</div>

  <script type="module" src="/controller/controller.js"></script>
</body>
</html>
